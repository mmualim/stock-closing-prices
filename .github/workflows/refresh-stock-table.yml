name: Refresh stock table

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. 12:00 UTC is 19:00 WIB, after HKEX/SGX close.
    - cron: "0 12 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh stock closing table
        run: python stock_closing_table.py

      - name: Commit refreshed outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/stock_closing_prices.csv outputs/stock_closing_prices.xlsx outputs/stock_closing_prices.html
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "Refresh stock closing prices"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: outputs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
